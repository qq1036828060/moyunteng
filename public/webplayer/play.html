<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC 播放器未部署</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #020617;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
    }

    .panel {
      max-width: 680px;
      line-height: 1.8;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 650;
    }

    p {
      margin: 8px 0;
      color: #cbd5e1;
      font-size: 15px;
    }

    code {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.18);
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <h1>WebRTC 播放器静态资源未部署</h1>
      <p>控制流程已经进入播放器入口，但没有检测到魔云腾官方 <code>play-myt.html</code> 播放器页面。</p>
      <p>请将官方播放器包解压到 <code>public/webplayer</code> 目录，至少需要包含 <code>play-myt.html</code>、<code>js/</code> 和 <code>public/images/</code>。</p>
      <p>如果播放器部署在独立服务，请配置 <code>VITE_APP_WEBRTC_PLAYER_BASE</code> 后重新启动前端。</p>
    </div>
  </div>
  <script>
    var query = window.location.search || "";

    fetch("./play-myt.html", { method: "HEAD", cache: "no-store" })
      .then(function (response) {
        if (response.ok) {
          window.location.replace("./play-myt.html" + query);
        }
      })
      .catch(function () {});
  </script>
</body>
</html>
